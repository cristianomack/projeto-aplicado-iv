<svg width="760" height="820" viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline da solução do projeto (revisado na Etapa 3)</title>
<desc>Fluxo: coleta de dados, pré-processamento, análise exploratória, divisão cronológica e baselines, modelagem em duas famílias (SARIMA/SARIMAX e Random Forest/Gradient Boosting), avaliação com refinamento, e camada de decisão com painéis técnico e público. Etapas tracejadas estão previstas para a Etapa 4.</desc>
